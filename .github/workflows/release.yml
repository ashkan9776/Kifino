name: Kifino Release - Automated Cross-Platform Build & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      is_draft:
        description: 'Create as Draft Release'
        type: boolean
        default: false
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false
      release_notes:
        description: 'Custom Release Notes'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  pre_release_checks:
    name: Verification (Analyze & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Test Suite
        run: flutter test

  build_android:
    name: Build Android Binaries (APK & AAB)
    needs: pre_release_checks
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Setup Release Keystore (Optional Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ] || [ -n "${KEY_ALIAS}" ] || [ -n "${KEY_PASSWORD}" ] || [ -n "${STORE_PASSWORD}" ]; then
            if [ -z "${KEYSTORE_BASE64}" ] || [ -z "${KEY_ALIAS}" ] || [ -z "${KEY_PASSWORD}" ] || [ -z "${STORE_PASSWORD}" ]; then
              echo "::error::Incomplete Android signing secrets. Provide all of KEYSTORE_BASE64, KEY_ALIAS, KEY_PASSWORD, and STORE_PASSWORD."
              exit 1
            fi
            echo "Configuring production release keystore from GitHub Secrets..."
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > android/app/upload-keystore.jks
            if [ ! -s android/app/upload-keystore.jks ]; then
              echo "::error::Decoded android/app/upload-keystore.jks is empty."
              exit 1
            fi
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "${STORE_PASSWORD}" \
              "${KEY_PASSWORD}" \
              "${KEY_ALIAS}" > android/key.properties
          else
            echo "No custom production keystore found in Secrets. Using fallback debug signing configuration."
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split-per-ABI Release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Collect & Organize Android Artifacts
        run: |
          mkdir -p artifacts/android
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/android/Kifino-Android-Universal.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk artifacts/android/Kifino-Android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk artifacts/android/Kifino-Android-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk artifacts/android/Kifino-Android-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab artifacts/android/Kifino-Android.aab

          cd artifacts/android
          sha256sum Kifino-Android-*.apk Kifino-Android.aab > sha256_android.txt
          cat sha256_android.txt

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-binaries
          path: artifacts/android/*

  build_windows:
    name: Build Windows Desktop Binary (Zip)
    needs: pre_release_checks
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable (Release)
        shell: bash
        run: |
          flutter build windows --release -v 2>&1 | tee build_windows.log || {
            echo "### ❌ Windows Build Failed" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build_windows.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: Package Windows Release as Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\windows | Out-Null
          $ReleaseDir = "build\windows\x64\runner\Release"
          $ZipPath = "artifacts\windows\Kifino-Windows-x64.zip"
          Compress-Archive -Path "$ReleaseDir\*" -DestinationPath $ZipPath -CompressionLevel Optimal
          
          # Compute SHA256 checksum
          $Hash = (Get-FileHash -Path $ZipPath -Algorithm SHA256).Hash.ToLower()
          "$Hash  Kifino-Windows-x64.zip" | Out-File -FilePath artifacts\windows\sha256_windows.txt -Encoding utf8
          Get-Content artifacts\windows\sha256_windows.txt

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-binary
          path: artifacts/windows/*

  publish_release:
    name: Publish GitHub Release
    needs: [build_android, build_windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release Tag: ${TAG}"

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-binaries
          path: release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-binary
          path: release_assets

      - name: Generate Checksums & Release Notes
        run: |
          cd release_assets
          cat sha256_android.txt sha256_windows.txt > checksums.txt
          rm -f sha256_android.txt sha256_windows.txt
          cd ..

          python3 .github/scripts/generate_release_notes.py \
            "release_assets/checksums.txt" \
            "release_body.md" \
            "${{ github.event.inputs.release_notes }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "کیفینو — Kifino ${{ steps.release_info.outputs.tag }}"
          body_path: release_body.md
          draft: ${{ github.event.inputs.is_draft || false }}
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          files: |
            release_assets/Kifino-Android-Universal.apk
            release_assets/Kifino-Android-arm64-v8a.apk
            release_assets/Kifino-Android-armeabi-v7a.apk
            release_assets/Kifino-Android-x86_64.apk
            release_assets/Kifino-Android.aab
            release_assets/Kifino-Windows-x64.zip
            release_assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
