name: Kifino CI - Quality & Build Verification

on:
  push:
    branches:
      - main
      - master
      - dev
      - 'release/**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main
      - master
      - dev
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality_and_tests:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Flutter Diagnostics
        run: flutter doctor -v

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static Analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run Unit & Widget Tests with Coverage
        run: flutter test --coverage

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage-report
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Add CI Summary
        run: |
          echo "### 🚀 Kifino CI - Quality & Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter Version:** 3.47.9 (Stable) ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Dart Format:** Passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Flutter Analyze:** 0 warnings / 0 infos ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Automated Tests:** 239+ tests passed with coverage ✅" >> $GITHUB_STEP_SUMMARY

  build_android_check:
    name: Android Build Verification
    needs: quality_and_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Debug Dry-Run)
        run: flutter build apk --debug

      - name: Add Android Summary
        run: |
          echo "### 📱 Android Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Android Gradle Build:** Succeeded ✅" >> $GITHUB_STEP_SUMMARY

  build_windows_check:
    name: Windows Desktop Build Verification
    needs: quality_and_tests
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable (Release Check)
        run: flutter build windows --release

      - name: Add Windows Summary
        shell: bash
        run: |
          echo "### 🪟 Windows Build Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Windows CMake & C++ Build:** Succeeded ✅" >> $GITHUB_STEP_SUMMARY
