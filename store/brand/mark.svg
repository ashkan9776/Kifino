<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Kifino mark: a wallet (کیف) holding a gold card. Glyph only, no tile. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D27A"/><stop offset="1" stop-color="#D9A93A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6F5F2"/>
    </linearGradient>
    <clipPath id="wallet"><rect x="104" y="196" width="304" height="200" rx="44"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#04302E" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- cards peeking out of the wallet -->
  <rect x="146" y="116" width="196" height="128" rx="22" fill="#CDEFEA" transform="rotate(-9 244 180)"/>
  <rect x="178" y="128" width="196" height="128" rx="22" fill="url(#gold)" transform="rotate(7 276 192)"/>
  <!-- wallet body -->
  <g filter="url(#soft)">
    <rect x="104" y="196" width="304" height="200" rx="44" fill="url(#body)"/>
  </g>
  <!-- clasp tab, clipped flush to the wallet's edge -->
  <g clip-path="url(#wallet)">
    <path d="M296 250 H420 V342 H296 a46 46 0 0 1 0 -92 Z" fill="#0B7F7A"/>
  </g>
  <circle cx="302" cy="296" r="19" fill="url(#gold)"/>
</svg>
