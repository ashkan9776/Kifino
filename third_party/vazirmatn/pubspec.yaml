name: vazirmatn
description: >-
  Vazirmatn — Persian/Arabic font family (vendored from the official
  pub.dev `vazirmatn` package, release v33.003 by Saber Rastikerdar).
  Vendored locally because pub.dev is unreachable from this environment;
  swap this path dependency back to the hosted package when network allows.
version: 33.3.3
homepage: https://github.com/rastikerdar/vazirmatn

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: fonts/Vazirmatn-Thin.ttf
          weight: 100
        - asset: fonts/Vazirmatn-ExtraLight.ttf
          weight: 200
        - asset: fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: fonts/Vazirmatn-Black.ttf
          weight: 900
